<!doctype html>
<html>
<head>
<style>

.container {
    width: 800px;
    height: 600px;
    border: 3px solid black;
    position: relative;
}
.box {
    height: 100px;
    width: 150px;
    margin: 4px;
    border: 2px solid black;
    text-align: center;
    color: white;
    position: absolute;
}
.box1 {
    background: red;
    top: 0;
    left: 0;
}
.box2 {
    background: blue;
    top: 0;
    right: 0;
}
.box3 {
    background: green;
    bottom: 0;
    left: 0;
}
.box4 {
    background: purple;
    bottom: 0;
    right: 0;
}
.box5 {
    background: orange;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
</style>
</head>
<body>

<div class="container">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
</div>

</body>
</html>
